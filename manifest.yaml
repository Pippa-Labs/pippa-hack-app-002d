# Mind the Gap: a memory palace on a real London Underground route.
# README.md explains every outcome, input and output, with examples.

manifest_version: 1

persistence: none

app_author_name: "Mind the gap"

app:
  id: hack.app_002d
  name: Mind the Gap
  version: 0.1.0
  # Never the word "by" in here: the badge is split on it.
  summary: >-
    Memorise anything on a real London Underground route: one fact per Tube
    station, with vivid scenes, quizzes and spaced review. Routes come from
    bundled TfL open data; if the owner has set a Claude key, your notes are
    sent to Anthropic's Claude to write the imagery.

agent_types:
  - personal

app_secrets:
  - name: ANTHROPIC_API_KEY
    description: "Claude API key, used to read prose notes, write station imagery and mark close answers"
    required: false

outcomes:
  # ── CONSTRUCT ────────────────────────────────────────────────────────────
  - id: palace.create
    summary: Build a memory palace that puts each fact to memorise at a real Tube station on a London Underground line
    example_phrases:
      - build me a memory palace on the tube
      - make a memory palace for these notes
      - help me memorise this list with tube stations
      - turn my revision notes into a tube journey
      - map these facts onto underground stations
      - memorise the planets along the victoria line
      - create a memory palace for bayes theorem
      - learn this list with the method of loci
    inputs: &palace_inputs
      - name: material
        type: string
        required: false
        description: >-
          What the person wants to memorise, copied exactly as they wrote it:
          a list, notes or a paragraph, keeping line breaks. If they only name
          a topic (for example "Bayes theorem", "the planets", "the wives of
          Henry VIII"), return just the topic. If they are continuing a memory
          palace from earlier, return the same material again. If there is no
          material in the message, return an empty string rather than guessing.
      - name: line
        type: string
        required: false
        description: >-
          The London Underground line they asked for, such as "Victoria" or
          "Central". Return an empty string if they did not name a line.
      - name: from_station
        type: string
        required: false
        description: >-
          The Tube station the route should start at, if they named one.
          Return an empty string otherwise; never guess a station.
      - name: to_station
        type: string
        required: false
        description: >-
          The Tube station the route should end at, if they named one.
          Return an empty string otherwise; never guess a station.
      - name: max_stations
        type: integer
        required: false
        description: >-
          The most stations to use, if they said a number (2 to 12). Leave
          this out entirely if they did not say one.
      - name: style
        type: string
        required: false
        description: >-
          The style of imagery they asked for, such as "funny", "spooky" or
          "for a ten year old". Return an empty string if they did not ask.
      - name: position
        type: integer
        required: false
        description: >-
          The stop number they are at now on their memory palace, if they said
          it. Leave this out entirely if they did not say a number.
      - name: current_station
        type: string
        required: false
        description: >-
          The station on their memory palace they say they are at now, or ask
          to jump to. Return an empty string if they did not name one.
      - name: action
        type: string
        required: false
        description: >-
          What they want to do on the journey, as one word: next, previous,
          repeat, skip or start. Return an empty string if it is unclear.
      - name: recall
        type: string
        required: false
        description: >-
          What the person remembered, copied exactly as they wrote it, for
          example "brixton prior, stockwell likelihood". Return an empty string
          if they did not give any answers.
      - name: struggled_with
        type: array
        item_type: string
        required: false
        description: >-
          The stations or concepts they say they got wrong, forgot or mixed
          up, one per item. Leave this out entirely if they named none.
      - name: review_count
        type: integer
        required: false
        description: >-
          How many times they have already reviewed this palace successfully,
          if they said. Leave this out entirely if they did not say.
      - name: palace
        type: object
        required: false
        description: >-
          The palace object returned earlier by this app, if it is available
          to pass back. Leave this out entirely otherwise.
      - name: retrieval_results
        type: object
        required: false
        description: >-
          The retrieval_results object returned earlier by this app's quiz, if
          it is available to pass back. Leave this out entirely otherwise.
    output:
      - name: title
        type: string
        description: What the palace is about.
      - name: route_summary
        type: string
        description: The line or lines, the first and last station, the number of stops and the minutes.
      - name: route_source
        type: string
        description: Where the route came from (the bundled TfL snapshot, plus live line status when it was reachable).
      - name: imagery_source
        type: string
        description: Who wrote the scenes, curated, template or claude, joined with + when mixed.
      - name: stations
        type: array
        item_type: string
        description: One line per stop, in order, as "1. Brixton (Victoria): Prior".
      - name: story
        type: string
        description: The whole journey in a few sentences.
      - name: palace
        type: object
        description: The full palace, every stop with its station, line, concept, scene and minutes.
      - name: resume_hint
        type: string
        description: What to say next to walk or test this palace.
      - name: resume_inputs
        type: object
        description: The inputs that rebuild exactly this palace on a later call.
      - name: notes
        type: array
        item_type: string
        description: Anything that was adjusted or fell back, in plain words.
      - name: live_status
        type: array
        item_type: string
        required: false
        description: Live TfL status for each line on the route, when it was reachable.

  # ── EXPERIENCE ───────────────────────────────────────────────────────────
  - id: palace.journey
    summary: Walk a memory palace one stop at a time, next, previous, repeat or skip a station
    example_phrases:
      - next stop on my memory palace
      - go back one stop
      - say that station again
      - skip this station
      - where am i on the route
      - take me to the next station
      - start the walk from the first stop
      - what is waiting at the next stop
    inputs: *palace_inputs
    output:
      - name: position
        type: integer
        description: The stop number now, counting from 1.
      - name: total
        type: integer
        description: How many stops the palace has.
      - name: station
        type: string
      - name: line
        type: string
      - name: concept
        type: string
        description: What is stored at this station.
      - name: scene
        type: string
        description: The image to picture at this station.
      - name: announcement
        type: string
        description: A Tube-style announcement for this stop.
      - name: at_end
        type: boolean
        description: True at the last stop.
      - name: action
        type: string
        description: The move that was made, start, next, previous, repeat or skip.
      - name: route_summary
        type: string
      - name: next_station
        type: string
        required: false
      - name: previous_station
        type: string
        required: false
      - name: passing
        type: array
        item_type: string
        required: false
        description: Stations the train passes through without stopping on the way here.

  # ── RETRIEVE ─────────────────────────────────────────────────────────────
  - id: palace.test
    summary: Quiz the person on a memory palace and mark what they recalled at each station
    example_phrases:
      - quiz me on my memory palace
      - test my recall of the palace
      - mark my answers please
      - here is what i recalled
      - how well did i recall it
      - grade my palace answers
      - check my answers for each stop
    inputs: *palace_inputs
    output:
      - name: mode
        type: string
        description: quiz when questions are being asked, graded when answers were marked.
      - name: total
        type: integer
      - name: questions
        type: array
        item_type: string
      - name: results
        type: array
        item_type: string
        description: One line per stop with its mark.
      - name: weak_stations
        type: array
        item_type: string
        description: Stations not recalled correctly.
      - name: grading_method
        type: string
        description: none, deterministic, or deterministic+claude.
      - name: route_summary
        type: string
      - name: score
        type: number
        required: false
        description: Share recalled, 0 to 1, half a point for nearly or misplaced.
      - name: correct
        type: integer
        required: false
      - name: order_correct
        type: boolean
        required: false
      - name: retrieval_results
        type: object
        required: false
        description: The marks, to pass on to strengthen the weak stations.

  # ── ADAPT ────────────────────────────────────────────────────────────────
  - id: palace.adapt
    summary: Strengthen the weak stations of a memory palace with stronger imagery and plan spaced review
    example_phrases:
      - strengthen the stations i got wrong
      - make the weak ones stick better
      - i keep mixing up two stations
      - when should i review my palace
      - plan my spaced repetition
      - give me stronger images for the ones i missed
      - i struggled with pimlico and vauxhall
    inputs: *palace_inputs
    output:
      - name: weak_stations
        type: array
        item_type: string
      - name: strengthened
        type: array
        item_type: string
        description: The new scene for each weak station.
      - name: unchanged
        type: array
        item_type: string
        description: Stations whose scenes were kept because they were recalled.
      - name: score
        type: number
      - name: next_review_at
        type: datetime
        description: When to test the palace again.
      - name: review_interval
        type: duration
      - name: review_count
        type: integer
        description: The review count to give next time.
      - name: review_plan
        type: array
        item_type: string
      - name: imagery_source
        type: string
      - name: palace
        type: object
        description: The palace with the strengthened scenes.
